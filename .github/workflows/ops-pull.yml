# 사람이 ops 이슈에서 확인한 패치 하나를 PR 로 연다. 검사·CI 승인 로직은 infra 의 ops-pull 정본.
# 공개 repo 라 정본이 URL·금지어 검사를 켠다. 금지어 목록은 공개 코드에 남지 않게 시크릿으로 둔다.
name: Ops Pull

on:
  workflow_dispatch:
    inputs:
      id:
        description: ops 이슈에 적힌 패치 id (YYYYMMDD-N)
        required: true
        type: string
      ops_commit:
        description: ops 이슈에 적힌 커밋 sha (40자). 확인한 그 커밋의 패치만 올린다
        required: true
        type: string

permissions: {}

concurrency:
  group: ops-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: TeamPiKi/infra/.github/actions/ops-pull@main
        with:
          id: ${{ inputs.id }}
          ops-commit: ${{ inputs.ops_commit }}
          ops-deploy-key: ${{ secrets.OPS_DEPLOY_KEY }}
          deny-pattern: ${{ secrets.OPS_DENY_PATTERN }}
