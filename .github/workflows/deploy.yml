# 배포: main push 자동 + 수동 트리거(workflow_dispatch) 단일 잡. 빌드 → 이미지 push → SSH 배포까지 러너가 주관한다.
#
# - transport 는 core 와 같은 "러너에서 SSH" 단일이다 (SSM Run Command 수동 배포를 대체 - 배포 블록 공통화 결정,
#   SG 22 개방은 #5). 기동·헬스 판정은 TeamPiKi/infra 의 공용 블록(run_container·healthcheck)을 매 배포
#   main 에서 checkout 해 쓴다 (SSOT 의도 - 블록 수정이 별도 커밋 없이 모든 소비자에 반영).
# - 이미지는 piki-extractor:{latest,<sha>} 로 레지스트리에 남긴다 (박스 로컬 :prod 빌드 관행을 대체).
#   롤백은 main 에 revert 를 머지하거나(push 트리거가 재배포), 헬스 실패 시 전환 없이 자동 중단된다.
# - blue-green 슬롯식이다: 소비자(core 워커)가 바라보는 :8090 은 박스 로컬 nginx 가 고정하고,
#   슬롯 컨테이너(blue=18090 / green=18091, 127.0.0.1 바인딩)를 upstream 전환으로 바꾼다.
#   초기의 "교체식 단일 컨테이너 + 수초 다운타임 허용" 결정은 renderer #15 미배포 사고(머지 후 수동
#   트리거 누락으로 이틀 방치)를 계기로 "머지 = 무조건 배포 + 무중단" 으로 대체됐다 (2026-08-10 결정).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # 박스(t4g/arm64)와 동일 arch 네이티브 빌드 - buildx 크로스빌드 불필요 (core deploy 와 같은 선택)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-arm64-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-arm64-

      - name: Build bootJar
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 태그·image ref 는 셸 보간 injection 을 피해 env 로 받아 "$VAR" 로 쓴다 (core deploy 와 같은 관례).
      - name: Build and push image
        env:
          IMAGE_LATEST: ${{ secrets.DOCKERHUB_USERNAME }}/piki-extractor:latest
          IMAGE_SHA: ${{ secrets.DOCKERHUB_USERNAME }}/piki-extractor:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_LATEST" -t "$IMAGE_SHA" .
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

      # 공용 블록 정본을 받아 박스로 올린다. strip_components: 2 로 shared-infra/blocks/ 를 떼어
      # /tmp/piki-blocks/*.sh 로 안착 (core deploy 와 동일 패턴).
      - name: Checkout infra blocks
        uses: actions/checkout@v4
        with:
          repository: TeamPiKi/infra
          ref: main
          # 경로 별칭은 shared-infra - 서비스 자신의 파일과 "공용 정본" 이 이름으로 구분되게 한다 (core 와 동일).
          path: shared-infra
          sparse-checkout: blocks
          persist-credentials: false

      # nginx 사이트 conf(이 repo 의 infra/nginx/extractor.conf)도 함께 올린다 - strip 2 로
      # shared-infra/blocks/·infra/nginx/ 가 똑같이 떨어져 /tmp/piki-blocks/ 평면에 안착한다.
      - name: Upload blocks
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "shared-infra/blocks/run_container.sh,shared-infra/blocks/healthcheck.sh,shared-infra/blocks/slot_decide.sh,shared-infra/blocks/slot_switch.sh,infra/nginx/extractor.conf"
          target: "/tmp/piki-blocks"
          strip_components: 2

      - name: Deploy (SSM env pull + blue-green slot + nginx switch)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piki-extractor:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -euo pipefail

            # ── 앱 시크릿/설정을 SSM 에서 pull 해 env 파일로 만든다 (/piki-extractor/app/<kebab-key>) ──
            # 경로를 app/ 하위로 좁혀 앱 소비분만 받는다 - 같은 prefix 의 관측 자격(grafana-*, 박스 Alloy 용)이
            # 경로 전량 pull 로 앱 컨테이너 env 에 섞이던 것을 이름 필터 대신 경로로 구조적으로 분리한다.
            # 값은 로그에 절대 남기지 않는다(set -x·echo 금지). aws-cli 는 공용 ECR 이미지(패치 태그 고정),
            # --network host 로 박스 instance role(IMDS) 자격증명에 닿는다 (읽기 권한 = extractor terraform 의 ssm-params).
            AWSCLI_IMAGE="public.ecr.aws/aws-cli/aws-cli:2.35.21"
            if ! PARAMS_JSON="$(docker run --rm --network host "$AWSCLI_IMAGE" \
              ssm get-parameters-by-path \
              --path "/piki-extractor/app/" --recursive --with-decryption \
              --region ap-northeast-2 --output json)"; then
              echo "::error::SSM get-parameters-by-path 호출 실패 - IAM 권한(ssm-params)·네트워크 확인"
              exit 1
            fi

            umask 077
            ENV_FILE="$(mktemp)"
            trap 'rm -f "$ENV_FILE"' EXIT
            # kebab-key -> UPPER_SNAKE 로 복원해 KEY=VALUE 라인으로 쓴다. docker --env-file 은 다중행 값을
            # 싣지 못하므로(현 파라미터는 전부 단일행) 다중행이 들어오면 조용히 깨지기 전에 여기서 실패시킨다.
            # PEM 류 다중행 파라미터가 생기면 core deploy 의 '-e KEY passthrough' 방식으로 옮길 것.
            if ! printf '%s' "$PARAMS_JSON" | python3 -c '
            import sys, json
            params = json.load(sys.stdin).get("Parameters", [])
            if not params:
                raise SystemExit("no parameters under /piki-extractor/app/")
            for p in params:
                key = p["Name"].rsplit("/", 1)[1].replace("-", "_").upper()
                val = p["Value"]
                if "\n" in val:
                    raise SystemExit(f"multi-line value not supported by --env-file: {key}")
                print(f"{key}={val}")' > "$ENV_FILE"; then
              echo "::error::SSM 파라미터 -> env 파일 변환 실패 (파라미터 0개 또는 다중행 값)"
              exit 1
            fi
            # 튜닝값(비시크릿)은 여기 고정 - 시크릿이 아니라 SSM 에 두지 않는다.
            echo "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70" >> "$ENV_FILE"
            # 관측 배선(비시크릿): 트레이스는 박스 로컬 Alloy(4318, 아래 --add-host 의 host-gateway 경유)로
            # push 하고, 로그는 공통 Loki 파이프라인이 전제하는 ECS JSON 으로 낸다. 아래 --label piki.* 와
            # 함께 관측 계약(TeamPiKi/infra contracts/observability.md)을 이룬다.
            echo "TRACING_OTLP_ENABLED=true" >> "$ENV_FILE"
            echo "OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces" >> "$ENV_FILE"
            echo "LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs" >> "$ENV_FILE"
            echo "SSM env $(grep -c '' "$ENV_FILE") 라인 로드 (/piki-extractor/app/)"

            chmod +x /tmp/piki-blocks/run_container.sh /tmp/piki-blocks/healthcheck.sh \
              /tmp/piki-blocks/slot_decide.sh /tmp/piki-blocks/slot_switch.sh

            # ── nginx 프로비저닝(멱등) - 무중단 전환의 고정 프론트(:8090) ──
            # 설치·conf 반영은 매 배포 수행하고, (재)시작·reload 는 아래 전환 블록(slot_switch)이 수행한다.
            command -v nginx >/dev/null || {
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            }
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo cp /tmp/piki-blocks/extractor.conf /etc/nginx/sites-available/piki-extractor
            sudo ln -sf /etc/nginx/sites-available/piki-extractor /etc/nginx/sites-enabled/piki-extractor

            # ── 슬롯 결정: 공용 블록(slot_decide)에 위임 - 상태 파일이 source of truth, 값(슬롯 이름·포트)은
            # 이 호출부가 소유한다. 할당 후 eval 2단계는 블록 헤더가 정한 소비 계약(치환 실패 은폐 방지).
            UPSTREAM_CONF=/etc/nginx/piki-extractor-upstream.conf
            DECIDED=$(bash /tmp/piki-blocks/slot_decide.sh --state-file "$UPSTREAM_CONF" \
              --slot-a blue:18090 --slot-b green:18091)
            eval "$DECIDED"
            echo "DEPLOY slot=$INACTIVE port=$INACTIVE_PORT (active=${ACTIVE_PORT:-none})"

            # 직전 배포의 teardown 이 끊겼으면 이 슬롯 컨테이너가 남아있을 수 있다 - run 의 이름·포트 충돌 전에
            # 정리하고, 데몬 지연에 대비해 timeout 상한을 건다 (core deploy 와 동일 가드).
            timeout 40 docker stop -t 30 "piki-extractor-$INACTIVE" 2>/dev/null || true
            timeout 30 docker rm -f "piki-extractor-$INACTIVE" 2>/dev/null || true

            # ── 새 버전을 비활성 슬롯에 기동 ──
            # --publish 127.0.0.1 바인딩: 슬롯은 nginx 경유로만 노출된다 (EIP 직접 접근 구조 차단 - conf 주석 참조).
            # --memory/--memory-swap: 박스(t4g.small 1.8G)는 swap 0 이라 blue+green overlap 이 RAM 안에 들어야
            #   한다. 2x640m + Alloy(약 100m) + nginx·시스템 여유 < 1.8G. 힙은 MaxRAMPercentage=70 이 cgroup 한도
            #   기준으로 잡혀 약 448m. 기존 무제한(호스트 70%) 대비 좁아진 값이라 파싱 스파이크 OOM 이 관측되면
            #   실측으로 재조정한다 (cgroup-OOM 은 슬롯 하나로 격리되고 --restart 가 재기동 - core 와 같은 설계).
            bash /tmp/piki-blocks/run_container.sh \
              --name "piki-extractor-$INACTIVE" --image "$IMAGE" --restart unless-stopped \
              --publish "127.0.0.1:$INACTIVE_PORT:8090" --env-file "$ENV_FILE" --pull --replace \
              --memory 640m --memory-swap 640m \
              --add-host host.docker.internal:host-gateway \
              --label piki.observe=true --label piki.service=piki-extractor \
              --label "piki.metrics.port=$INACTIVE_PORT" --label piki.metrics.path=/actuator/prometheus

            # 새 슬롯 직접 헬스 판정 (전환 전이라 실패해도 트래픽은 기존 경로가 그대로 서빙 - 정리 후 중단)
            if ! bash /tmp/piki-blocks/healthcheck.sh \
              --url "http://127.0.0.1:$INACTIVE_PORT/actuator/health" --interval 5 --attempts 36 \
              --expect-body '"status":"UP"'; then
              echo "::error::새 슬롯 헬스체크 실패 - 전환 없이 중단 (기존 슬롯이 계속 서빙)"
              timeout 40 docker stop -t 30 "piki-extractor-$INACTIVE" 2>/dev/null || true
              timeout 30 docker rm -f "piki-extractor-$INACTIVE" 2>/dev/null || true
              exit 1
            fi

            # ── 전환: 공용 블록(slot_switch)에 위임 ──
            # 갱신 → nginx -t → reload(정지 시 restart 폴백) → 프론트 경유 최종 검증까지 블록의 원복 경계
            # 안에서 돈다: 어느 단계가 실패해도 이전 upstream 이 원복되고 exit 1 이 온다. 검증 실패 시
            # 새 슬롯 정리는 호출자 몫(블록은 컨테이너를 모른다). 이행 1회차의 레거시 단일 컨테이너 분기는
            # 이행 완료(2026-08-10)로 제거됐다.
            sudo systemctl enable nginx >/dev/null 2>&1 || true
            if ! bash /tmp/piki-blocks/slot_switch.sh \
              --state-file "$UPSTREAM_CONF" --server "127.0.0.1:$INACTIVE_PORT" \
              --verify-cmd "bash /tmp/piki-blocks/healthcheck.sh --url http://localhost:8090/actuator/health --interval 2 --attempts 10 --expect-body '\"status\":\"UP\"'"; then
              echo "::error::슬롯 전환 실패(이전 upstream 원복됨) - 새 슬롯 정리 후 중단"
              timeout 40 docker stop -t 30 "piki-extractor-$INACTIVE" 2>/dev/null || true
              timeout 30 docker rm -f "piki-extractor-$INACTIVE" 2>/dev/null || true
              exit 1
            fi

            # 구 슬롯 종료 - 전환은 이미 끝났으므로 best-effort (데몬 지연이 성공한 배포를 못 막게 timeout 상한).
            # 부트스트랩(ACTIVE 빈 값)이면 종료할 구 슬롯이 없다.
            if [ -n "$ACTIVE" ]; then
              timeout 60 docker stop -t 30 "piki-extractor-$ACTIVE" 2>/dev/null || true
              timeout 30 docker rm -f "piki-extractor-$ACTIVE" 2>/dev/null || true
            fi

            # 이전 이미지 정리 (dangling 만 - 직전 sha 태그는 남겨 수동 롤백 여지 유지)
            docker image prune -f >/dev/null
