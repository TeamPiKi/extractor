# 배포: main CI 성공(workflow_run) 자동 + 수동 트리거(workflow_dispatch) 단일 잡. 이미지 push → SSH 배포까지 러너가 주관한다.
# JAR 은 자동 경로면 트리거한 CI 실행의 아티팩트를 받고, 수동 경로만 러너에서 빌드한다 (core deploy 와 같은 구조).
#
# - transport 는 core 와 같은 "러너에서 SSH" 단일이다 (SSM Run Command 수동 배포를 대체 - 배포 블록 공통화 결정,
#   SG 22 개방은 #5). 기동·헬스 판정은 TeamPiKi/infra 의 공용 블록(run_container·healthcheck)을 매 배포
#   main 에서 checkout 해 쓴다 (SSOT 의도 - 블록 수정이 별도 커밋 없이 모든 소비자에 반영).
# - 이미지는 piki-extractor:{latest,<sha>} 로 레지스트리에 남긴다 (박스 로컬 :prod 빌드 관행을 대체).
#   롤백은 main 에 revert 를 머지하거나(CI 성공이 재배포), 헬스 실패 시 전환 없이 자동 중단된다.
# - blue-green 슬롯식이다: 소비자(core 워커)가 바라보는 :8090 은 박스 로컬 nginx 가 고정하고,
#   슬롯 컨테이너(blue=18090 / green=18091, 127.0.0.1 바인딩)를 upstream 전환으로 바꾼다.
#   초기의 "교체식 단일 컨테이너 + 수초 다운타임 허용" 결정은 renderer #15 미배포 사고(머지 후 수동
#   트리거 누락으로 이틀 방치)를 계기로 "머지 = 무조건 배포 + 무중단" 으로 대체됐다 (2026-08-10 결정).
name: Deploy

# request_id 가 오면 제목에 실어, 호출자(core 의 migrate.yml)가 자기 dispatch 로 생긴 실행만
# 정확히 집어낼 수 있게 한다. 없으면 기본 제목.
run-name: ${{ inputs.request_id && format('Deploy (req {0})', inputs.request_id) || 'Deploy' }}

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      migration_host:
        description: "[이관 전용] 배포 대상 호스트를 직접 지정한다. 비우면 secrets.EC2_HOST. 평소에는 비워 둘 것."
        required: false
        type: string
        default: ""
      migration_role_arn:
        description: "[이관 전용] ECR push 에 쓸 역할 ARN. 신 계정 이미지 푸시용. 비우면 vars.AWS_ECR_PUSH_ROLE_ARN(구 계정 역할)."
        required: false
        type: string
        default: ""
      request_id:
        description: "[이관 전용] 호출자가 자기 실행을 특정하려고 넘기는 값. run-name 에 실려 조회 키가 된다."
        required: false
        type: string
        default: ""
  # 계정 이관(TeamPiKi/core 의 migrate.yml)이 신 계정 박스로 이 배포를 돌리려고 호출한다.
  # 호출측이 대상 호스트를 넘기고 secrets 는 inherit 로 받는다.
  workflow_call:
    inputs:
      migration_host:
        description: "[이관 전용] 배포 대상 호스트. 비우면 secrets.EC2_HOST."
        required: false
        type: string
        default: ""
      migration_role_arn:
        description: "[이관 전용] ECR push 에 쓸 역할 ARN(신 계정)."
        required: false
        type: string
        default: ""

concurrency:
  # 그룹은 단일 'deploy' 로 둔다. 대상 호스트별로 가르면 호출자가 secrets.EC2_HOST 와 같은 주소를
  # migration_host 로 넘겼을 때 'deploy-default' 와 'deploy-<host>' 로 갈려 같은 박스에 두 배포가
  # 동시에 돌 수 있다 — 슬롯 선택·nginx 전환·구 컨테이너 정리가 서로를 밟는다.
  # 이관은 드문 1회성이라 평소 배포가 잠깐 대기하는 비용보다 그 충돌을 막는 편이 싸다.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # 트리거한 CI 실행의 아티팩트를 다른 run 에서 내려받는 데 필요하다.
  actions: read
  # OIDC 로 ECR push 역할을 assume 하는 데 필요하다.
  id-token: write

env:
  # workflow_run 의 github.sha 는 기본 브랜치 끝이라, 배포 도중 다른 push 가 오면 CI 가 빌드한 커밋과 어긋난다.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # workflow_call(계정 이관 호출)도 통과시킨다 — 빠뜨리면 호출돼도 job 이 통째로 skip 된다.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm # 박스(t4g/arm64)와 동일 arch 네이티브 빌드 - buildx 크로스빌드 불필요 (core deploy 와 같은 선택)
    steps:
      # 재사용 호출(workflow_call)이면 checkout 의 기본 대상이 "호출자 레포" 라, 명시하지 않으면 이 레포가
      # 아니라 core 소스를 받아 빌드한다(실측 — core 의 proto 참조가 Unresolved reference 로 터졌다).
      #
      # 호출 여부를 github.event_name 으로 가르면 안 된다 — 재사용 워크플로는 호출자의 event_name 을
      # 그대로 물려받아 'workflow_dispatch' 로 보인다(실측: 그 조건으로는 분기가 안 걸려 core 를 받았다).
      # github.repository 가 이 레포인지로 판별한다(호출되면 호출자 레포명이 들어온다).
      - uses: actions/checkout@v4
        with:
          repository: TeamPiKi/extractor
          ref: ${{ github.repository == 'TeamPiKi/extractor' && env.DEPLOY_SHA || 'main' }}
          persist-credentials: false

      # 이미지 태그는 "실제로 빌드한 커밋" 이어야 한다. workflow_call 은 이 레포의 main 을 받는데
      # env.DEPLOY_SHA 는 호출자 커밋이라, 그대로 태그에 쓰면 호출자 재실행 때 extractor/main 이
      # 바뀐 사이 다른 이미지가 같은 태그를 덮어쓴다(ECR mutable 태그). SHA 태그를 롤백 좌표로
      # 쓰는 계약도 깨진다. 체크아웃한 HEAD 를 직접 읽어 그 값을 쓴다.
      - name: Resolve built SHA
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 공용 contract 는 러너 빌드 경로(dispatch·call)에서 필요하다. workflow_run 은 CI 아티팩트를 받아 쓴다.
      - name: Checkout extraction contract (manual dispatch fallback)
        # 러너 빌드 경로(수동 dispatch·재사용 호출)에서 필요하다. 호출은 event_name 으로 못 가르므로
        # "workflow_run 이 아니거나, 호출돼서 repository 가 이 레포가 아닌" 경우로 판별한다.
        if: github.event_name != 'workflow_run' || github.repository != 'TeamPiKi/extractor'
        uses: actions/checkout@v4
        with:
          repository: TeamPiKi/infra
          ref: main
          path: shared-infra
          sparse-checkout: contracts
          persist-credentials: false

      # workflow_run 이면 트리거한 CI run 의 아티팩트, dispatch 면 러너 빌드.
      - name: Resolve JAR
        uses: TeamPiKi/infra/.github/actions/app-jar-resolve@main
        with:
          java-version: '25'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.migration_role_arn != '' && inputs.migration_role_arn || vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # 태그·image ref 는 셸 보간 injection 을 피해 env 로 받아 "$VAR" 로 쓴다 (core deploy 와 같은 관례).
      - name: Build and push image
        env:
          # 레지스트리 호스트는 로그인 액션이 낸다. 계정번호를 repo 에 박지 않는다.
          IMAGE_LATEST: ${{ steps.ecr_login.outputs.registry }}/piki-extractor:latest
          IMAGE_SHA: ${{ steps.ecr_login.outputs.registry }}/piki-extractor:${{ steps.built.outputs.sha }}
        run: |
          docker build -t "$IMAGE_LATEST" -t "$IMAGE_SHA" .
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

      # 공용 블록 정본을 받아 박스로 올린다. strip_components: 2 로 shared-infra/blocks/ 를 떼어
      # /tmp/piki-blocks/*.sh 로 안착 (core deploy 와 동일 패턴).
      - name: Checkout infra blocks
        uses: actions/checkout@v4
        with:
          repository: TeamPiKi/infra
          ref: main
          # 경로 별칭은 shared-infra - 서비스 자신의 파일과 "공용 정본" 이 이름으로 구분되게 한다 (core 와 동일).
          path: shared-infra
          sparse-checkout: blocks
          persist-credentials: false

      # nginx 사이트 conf(이 repo 의 infra/nginx/extractor.conf)도 함께 올린다 - strip 2 로
      # shared-infra/blocks/·infra/nginx/ 가 똑같이 떨어져 /tmp/piki-blocks/ 평면에 안착한다.
      - name: Upload blocks
        uses: appleboy/scp-action@v1
        with:
          host: ${{ inputs.migration_host != '' && inputs.migration_host || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "shared-infra/blocks/run_container.sh,shared-infra/blocks/healthcheck.sh,shared-infra/blocks/slot_decide.sh,shared-infra/blocks/slot_switch.sh,shared-infra/blocks/deploy_slot.sh,shared-infra/blocks/ssm_env.sh,infra/nginx/extractor.conf,infra/scripts/provision-observability.sh"
          target: "/tmp/piki-blocks"
          strip_components: 2

      # 관측 수집기(Alloy)를 매 배포 갱신한다. 이 단계가 없던 동안 공용 config(TeamPiKi/infra
      # blocks/alloy)를 고쳐도 이 박스에는 영영 반영되지 않았다 - 스크립트는 있었지만 사람이 박스에서
      # 수동 실행할 때만 돌았기 때문이다(2026-08-13 실측: infra#44 감축 후에도 collector 41 그대로,
      # 같은 변경이 적용된 core dev 박스는 12). core 가 provision-runtime.sh 로 하는 일과 같은 결이다.
      #
      # 앱 배포 앞에 둔다: 순서를 core 와 맞추고, 관측이 깨진 채 앱만 새로 올라가는 상태를 막는다.
      # 스크립트는 자기 완결적이라(공용 블록을 raw.githubusercontent 에서 직접 fetch, 자격은 박스가
      # SSM 공유 경로에서 직접 읽음) 러너가 넘길 인자·secret 이 없다.
      - name: Provision observability (Alloy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.migration_host != '' && inputs.migration_host || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            chmod +x /tmp/piki-blocks/provision-observability.sh
            /tmp/piki-blocks/provision-observability.sh

      - name: Deploy (SSM env pull + blue-green slot + nginx switch)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.built.outputs.sha }}
        with:
          host: ${{ inputs.migration_host != '' && inputs.migration_host || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail

            # ── 앱 시크릿/설정을 SSM 에서 pull 해 env 파일로 만든다 (/piki-extractor/app/<kebab-key>) ──
            # 경로를 app/ 하위로 좁혀 앱 소비분만 받는다 - 같은 prefix 의 관측 자격(grafana-*, 박스 Alloy 용)이
            # 경로 전량 pull 로 앱 컨테이너 env 에 섞이던 것을 이름 필터 대신 경로로 구조적으로 분리한다.
            # 값은 로그에 절대 남기지 않는다(set -x·echo 금지). aws-cli 는 공용 ECR 이미지(패치 태그 고정),
            # --network host 로 박스 instance role(IMDS) 자격증명에 닿는다 (읽기 권한 = extractor terraform 의 ssm-params).
            AWSCLI_IMAGE="public.ecr.aws/aws-cli/aws-cli:2.35.21"
            if ! PARAMS_JSON="$(docker run --rm --network host "$AWSCLI_IMAGE" \
              ssm get-parameters-by-path \
              --path "/piki-extractor/app/" --recursive --with-decryption \
              --region ap-northeast-2 --output json)"; then
              echo "::error::SSM get-parameters-by-path 호출 실패 - IAM 권한(ssm-params)·네트워크 확인"
              exit 1
            fi

            umask 077
            ENV_FILE="$(mktemp)"
            trap 'rm -f "$ENV_FILE"' EXIT
            # 아래 튜닝·관측 값을 파일 끝에 덧붙이므로 같은 이름의 SSM 키는 예약으로 막는다.
            if ! PARAM_COUNT="$(printf '%s' "$PARAMS_JSON" | bash /tmp/piki-blocks/ssm_env.sh --out "$ENV_FILE" \
              --reserve JAVA_TOOL_OPTIONS --reserve TRACING_OTLP_ENABLED --reserve OTLP_ENDPOINT \
              --reserve LOGGING_STRUCTURED_FORMAT_CONSOLE)"; then
              echo "::error::SSM 파라미터 -> env 파일 변환 실패 (파라미터 0개 · 다중행 값 · 예약 이름 충돌 - 블록 stderr 참조)"
              exit 1
            fi
            # 튜닝값(비시크릿)은 여기 고정 - 시크릿이 아니라 SSM 에 두지 않는다.
            echo "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70" >> "$ENV_FILE"
            # 관측 배선(비시크릿): 트레이스는 박스 로컬 Alloy(4318, 아래 --add-host 의 host-gateway 경유)로
            # push 하고, 로그는 공통 Loki 파이프라인이 전제하는 ECS JSON 으로 낸다. 아래 --label piki.* 와
            # 함께 관측 계약(TeamPiKi/infra contracts/observability.md)을 이룬다.
            echo "TRACING_OTLP_ENABLED=true" >> "$ENV_FILE"
            echo "OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces" >> "$ENV_FILE"
            echo "LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs" >> "$ENV_FILE"
            echo "SSM 에서 $PARAM_COUNT 개 파라미터 로드 (/piki-extractor/app/)"

            # ECR 레지스트리는 온박스에서 도출한다. 계정번호를 워크플로에 안 박는다 (core 와 동일).
            # pull 자격은 instance role 의 ecr-pull 정책(infra/extractor/ecr.tf). run_container --pull 이 이 로그인을 쓴다.
            ACCOUNT="$(docker run --rm --network host "$AWSCLI_IMAGE" sts get-caller-identity --query Account --output text)"
            REGISTRY="$ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com"
            IMAGE="$REGISTRY/piki-extractor:$IMAGE_TAG"
            docker run --rm --network host "$AWSCLI_IMAGE" ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin "$REGISTRY"

            chmod +x /tmp/piki-blocks/*.sh

            # ── nginx 프로비저닝(멱등) - 무중단 전환의 고정 프론트(:8090) ──
            # 설치·conf 반영은 매 배포 수행하고, (재)시작·reload 는 아래 전환 블록(slot_switch)이 수행한다.
            command -v nginx >/dev/null || {
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            }
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo cp /tmp/piki-blocks/extractor.conf /etc/nginx/sites-available/piki-extractor
            sudo ln -sf /etc/nginx/sites-available/piki-extractor /etc/nginx/sites-enabled/piki-extractor

            # ── blue-green 배포: 공용 블록(deploy_slot)이 결정·기동·슬롯 헬스·전환·구 슬롯 종료를 맡는다.
            # 실패 시 새 슬롯을 정리하고 exit 1, 그동안 트래픽은 구 슬롯이 서빙한다. 값은 전부 여기서 준다.
            # --publish 127.0.0.1 바인딩(nginx 경유로만 노출)과 metrics 포트 라벨은 블록이 슬롯 값으로 채운다.
            # --memory/--memory-swap: 박스(t4g.small 1.8G)는 swap 0 이라 blue+green overlap 이 RAM 안에 들어야
            #   한다. 2x640m + Alloy(약 100m) + nginx·시스템 여유 < 1.8G. 힙은 MaxRAMPercentage=70 이 cgroup 한도
            #   기준으로 잡혀 약 448m. 파싱 스파이크 OOM 이 관측되면 실측으로 재조정한다.
            sudo systemctl enable nginx >/dev/null 2>&1 || true
            bash /tmp/piki-blocks/deploy_slot.sh \
              --state-file /etc/nginx/piki-extractor-upstream.conf \
              --slot-a blue:18090 --slot-b green:18091 \
              --name-prefix piki-extractor --container-port 8090 \
              --health-path /actuator/health --health-interval 5 --health-attempts 36 --health-expect-body '"status":"UP"' \
              --verify-cmd "bash /tmp/piki-blocks/healthcheck.sh --url http://localhost:8090/actuator/health --interval 2 --attempts 10 --expect-body '\"status\":\"UP\"'" \
              -- --image "$IMAGE" --restart unless-stopped --env-file "$ENV_FILE" --pull \
              --memory 640m --memory-swap 640m \
              --add-host host.docker.internal:host-gateway \
              --label piki.observe=true --label piki.service=piki-extractor --label piki.metrics.path=/actuator/prometheus

            # 이전 이미지 정리 (dangling 만 - 직전 sha 태그는 남겨 수동 롤백 여지 유지)
            docker image prune -f >/dev/null
