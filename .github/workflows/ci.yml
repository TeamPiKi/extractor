# core 의 ci.yml 과 같은 구조를 따르되, 이 서비스는 DB 가 없어 Testcontainers/Docker 없이 test 까지 그냥 돈다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout extraction contract
        uses: actions/checkout@v4
        with:
          repository: TeamPiKi/infra
          ref: main
          path: shared-infra
          sparse-checkout: contracts
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # E2E(*E2ETest)는 @Disabled/@EnabledIfEnvironmentVariable 로 격리돼 CI 에선 스킵된다 (TestConventionTest 가 강제).
      - name: Build and test
        run: ./gradlew build --no-daemon

      # deploy.yml 이 workflow_run 으로 이 JAR 을 받아 쓴다. 보존 3일은 그 소비가 수분 내라 충분하고,
      # 롤백·수동 재배포는 옛 아티팩트에 기대지 않는다(수동 dispatch 는 러너 빌드 fallback).
      - name: Upload JAR artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 3
          if-no-files-found: error
          # JAR 은 이미 zip 이라 재압축은 CPU 만 쓴다.
          compression-level: 0